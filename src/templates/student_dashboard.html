<!-- src/templates/student_dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available quizzes - Mini LMS</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Available quizzes</h1>
    <form method="post" action="{{ url_for('auth.logout') }}">
        <button type="submit">Sign out</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Lecturer</th>
                <th>Duration (min)</th>
                <th>Closes at</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for quiz in quizzes %}
            <tr>
                <td><strong>{{ quiz.title }}</strong></td>
                <td>{{ quiz.lecturer_name }}</td>
                <td>{{ quiz.duration_minutes }}</td>
                <td>{{ quiz.end_at }}</td>
                <td>
                    <form method="post" action="{{ url_for('student.start_quiz', quiz_id=quiz.quiz_id) }}">
                        <button type="submit">Take quiz</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No published quizzes available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
