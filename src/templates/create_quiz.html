
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - Mini LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #263238;
        }

        .header {
            background: white;
            padding: 20px 40px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            color: #2563eb;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .required {
            color: #dc2626;
        }

        input[aria-invalid="true"] {
            border-color: #dc2626;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .hint {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 16px 20px;
            }

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            .actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h2>Mini LMS</h2>
        <span>Lecturer Panel</span>
    </header>

    <main class="container">
        <div class="card">

            <h1>Create New Quiz</h1>

            <p class="subtitle">
                Enter quiz information to create a new draft.
            </p>

            {% if error %}
            <div class="error" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form
                action="{{ url_for('quiz.submit_create_quiz') }}"
                method="POST"
                novalidate
            >

                <!-- QUIZ TITLE -->
                <div class="form-group">
                    <label for="title">
                        Quiz Title
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter quiz title"
                        value="{{ title }}"
                        aria-required="true"
                        {% if error == "Quiz title is required." %}
                        aria-invalid="true"
                        {% endif %}
                    >
                </div>

                <!-- DESCRIPTION -->
                <div class="form-group">
                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Enter quiz description"
                    >{{ description | default('', true) }}</textarea>

                    <p class="hint">
                        Optional: Describe the content of this quiz.
                    </p>
                </div>

                <!-- DURATION -->
                <div class="form-group">
                    <label for="duration">
                        Duration (minutes)
                        <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        id="duration"
                        name="duration"
                        min="1"
                        step="1"
                        value="{{ duration }}"
                        aria-required="true"
                    >

                    <p class="hint">
                        The duration must be greater than 0 minutes.
                    </p>
                </div>

                <!-- ACTIONS -->
                <div class="actions">
                    <a
                        href="{{ url_for('lecturer.lecturer_dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Quiz
                    </button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
