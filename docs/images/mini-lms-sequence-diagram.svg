<?xml version="1.0" encoding="UTF-8"?>
<svg width="1500" height="1000" viewBox="0 0 1500 1000" 
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <path d="M0,0 L10,4 L0,8 Z" fill="#222"/>
        </marker>
        <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111; }
      .label { font: 600 18px Arial, sans-serif; fill: #1a1a1a; }
      .small { font: 500 15px Arial, sans-serif; fill: #1a1a1a; }
      .actor { font: 700 20px Arial, sans-serif; fill: #111; }
      .box { fill: #ffffff; stroke: #222; stroke-width: 2; rx: 14; }
      .lifeline { stroke: #444; stroke-width: 2; stroke-dasharray: 7 7; }
      .msg { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .note { fill: #f8f8f8; stroke: #888; stroke-width: 1.5; }
    </style>
    </defs>
    <rect x="0" y="0" width="1500" height="1000" fill="#f8f9fb"/>
    <text x="750" y="50" text-anchor="middle" class="title">Mini LMS - Sequence Diagram</text>
    <!-- Participant boxes -->
    <rect x="60" y="90" width="180" height="60" class="box"/>
    <text x="150" y="128" text-anchor="middle" class="actor">Lecturer</text>
    <rect x="330" y="90" width="180" height="60" class="box"/>
    <text x="420" y="128" text-anchor="middle" class="actor">Student</text>
    <rect x="600" y="90" width="240" height="60" class="box"/>
    <text x="720" y="128" text-anchor="middle" class="actor">Mini LMS</text>
    <rect x="940" y="90" width="220" height="60" class="box"/>
    <text x="1050" y="128" text-anchor="middle" class="actor">Quiz Service</text>
    <rect x="1220" y="90" width="180" height="60" class="box"/>
    <text x="1310" y="128" text-anchor="middle" class="actor">Database</text>
    <!-- Lifelines -->
    <line x1="150" y1="150" x2="150" y2="930" class="lifeline"/>
    <line x1="420" y1="150" x2="420" y2="930" class="lifeline"/>
    <line x1="720" y1="150" x2="720" y2="930" class="lifeline"/>
    <line x1="1050" y1="150" x2="1050" y2="930" class="lifeline"/>
    <line x1="1310" y1="150" x2="1310" y2="930" class="lifeline"/>
    <!-- Lecturer creates quiz -->
    <path d="M150 200 L720 200" class="msg"/>
    <text x="435" y="185" text-anchor="middle" class="small">1. Create quiz draft</text>
    <path d="M720 240 L1050 240" class="msg"/>
    <text x="885" y="225" text-anchor="middle" class="small">2. Validate quiz data</text>
    <path d="M1050 280 L1310 280" class="msg"/>
    <text x="1180" y="265" text-anchor="middle" class="small">3. Save draft quiz</text>
    <path d="M1310 330 L1050 330" class="msg"/>
    <text x="1180" y="315" text-anchor="middle" class="small">4. Draft saved</text>
    <path d="M150 380 L720 380" class="msg"/>
    <text x="435" y="365" text-anchor="middle" class="small">5. Add questions and options</text>
    <path d="M720 430 L1050 430" class="msg"/>
    <text x="885" y="415" text-anchor="middle" class="small">6. Validate choices</text>
    <path d="M1050 470 L1310 470" class="msg"/>
    <text x="1180" y="455" text-anchor="middle" class="small">7. Store questions</text>
    <path d="M150 520 L720 520" class="msg"/>
    <text x="435" y="505" text-anchor="middle" class="small">8. Publish quiz</text>
    <path d="M720 560 L1050 560" class="msg"/>
    <text x="885" y="545" text-anchor="middle" class="small">9. Check validity and time limit</text>
    <path d="M1050 600 L1310 600" class="msg"/>
    <text x="1180" y="585" text-anchor="middle" class="small">10. Update status = Published</text>
    <path d="M1310 640 L720 640" class="msg"/>
    <text x="1015" y="625" text-anchor="middle" class="small">11. Published status confirmed</text>
    <path d="M720 680 L150 680" class="msg"/>
    <text x="435" y="665" text-anchor="middle" class="small">12. Quiz available to students</text>
    <!-- Student takes quiz -->
    <path d="M420 750 L720 750" class="msg"/>
    <text x="570" y="735" text-anchor="middle" class="small">13. View available quizzes</text>
    <path d="M720 790 L1050 790" class="msg"/>
    <text x="885" y="775" text-anchor="middle" class="small">14. Fetch published quizzes</text>
    <path d="M1050 830 L1310 830" class="msg"/>
    <text x="1180" y="815" text-anchor="middle" class="small">15. Query quiz list</text>
    <path d="M1310 870 L720 870" class="msg"/>
    <text x="1015" y="855" text-anchor="middle" class="small">16. Return quiz list and deadlines</text>
    <path d="M720 905 L420 905" class="msg"/>
    <text x="570" y="890" text-anchor="middle" class="small">17. Display quiz and start attempt</text>
    <!-- Optional note -->
    <rect x="760" y="180" width="350" height="70" class="note"/>
    <text x="935" y="210" text-anchor="middle" class="small">Lecture flow</text>
    <text x="935" y="235" text-anchor="middle" class="small">Create → validate → publish → visible to students</text>
    <rect x="760" y="710" width="420" height="80" class="note"/>
    <text x="970" y="740" text-anchor="middle" class="small">Student flow</text>
    <text x="970" y="765" text-anchor="middle" class="small">View → start attempt → submit → see score</text>
</svg>
