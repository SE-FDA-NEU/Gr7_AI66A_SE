<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} - Mini LMS</title>
</head>
<body>
    <main>
        <h1>{{ status_code }}</h1>
        <p role="alert">{{ message }}</p>
        {% if session.get('role') == 'student' %}
        <a href="{{ url_for('student.student_dashboard') }}">Back to dashboard</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}">Back to sign in</a>
        {% endif %}
    </main>
</body>
</html>
