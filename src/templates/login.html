<!DOCTYPE html>
<!-- Trang đăng nhập: hiển thị lỗi nếu có và gửi email/mật khẩu kèm CSRF token tới route auth.login. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Mini LMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hig.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>Sign in to Mini LMS</h1>
        {% if error %}
        <!-- Thông báo lỗi do route truyền vào; email được giữ lại để người dùng không phải nhập lại. -->
        <p class="alert alert-error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <!-- Token CSRF xác nhận form POST được tạo từ chính ứng dụng này. -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username"
                   value="{{ email or '' }}" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
